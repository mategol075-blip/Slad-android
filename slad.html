<!doctype html>
<html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ślad — mały żywy świat</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101f1b;color:#eef5df;font:16px system-ui;text-align:center;padding:20px 14px}main{max-width:520px;margin:auto}header{text-align:left}small{color:#a4b6a7;letter-spacing:2px}h1{font-size:44px;margin:6px 0}p{color:#bcccbb;line-height:1.5}canvas{display:block;width:100%;height:auto;border:1px solid #4d6448;border-radius:18px;background:#3c663f;touch-action:none}#status{min-height:48px;padding:12px;color:#edd49b}.pad{display:grid;grid-template-columns:repeat(3,66px);gap:8px;justify-content:center;margin:8px auto 20px}button{font:24px system-ui;color:#eff7e7;border:1px solid #526957;background:#293e33;border-radius:15px;min-height:58px;touch-action:none;user-select:none}button:active{background:#567348}#reset{font-size:14px;padding:0 20px;min-height:42px}footer{font-size:12px;color:#90a58f;margin-top:16px}
</style>
<main><header><small>MAŁY ŻYWY ŚWIAT · PROTOTYP 01</small><h1>Ślad<span style="color:#dcbf77">.</span></h1><p>Wracaj tą samą drogą. Po 5 przejściach powstanie ścieżka. Opuszczone miejsca znów porosną trawą.</p></header><canvas id="map" width="480" height="480" aria-label="Mapa gry. Steruj przyciskami poniżej lub strzałkami."></canvas><div id="status" role="status" aria-live="polite"></div><div class="pad"><span></span><button aria-label="W górę" data-d="0,-1">↑</button><span></span><button aria-label="W lewo" data-d="-1,0">←</button><button aria-label="W dół" data-d="0,1">↓</button><button aria-label="W prawo" data-d="1,0">→</button></div><button id="reset">Zacznij od nowa</button><footer>Telefon: przytrzymaj strzałkę · Komputer: strzałki lub WASD<br>Ścieżki zaczynają zarastać po 20 sekundach bez odwiedzin.</footer></main>
<script>
'use strict';
const canvas=document.querySelector('#map'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');
const N=16,S=30,rocks=new Set(['3,3','4,3','3,4','11,5','12,5','12,6','5,11','5,12','10,12','11,12']);
let cells,player,steps,held=null,lastMove=0;
function reset(){cells=Array.from({length:N*N},()=>({wear:0,last:0}));player={x:8,y:8};steps=0;held=null;draw()}
function move(dx,dy){const x=player.x+dx,y=player.y+dy;if(x<0||y<0||x>=N||y>=N||rocks.has(x+','+y))return;player={x,y};const c=cells[y*N+x];c.wear=Math.min(10,c.wear+1);c.last=performance.now();steps++;draw()}
function draw(){let paths=0;ctx.clearRect(0,0,480,480);for(let y=0;y<N;y++)for(let x=0;x<N;x++){const c=cells[y*N+x],path=c.wear>=5;if(path)paths++;ctx.fillStyle=path?'#aa9365':c.wear>0?'#68804b':((x*7+y*11)%3===0?'#426c43':'#3b633e');ctx.fillRect(x*S,y*S,S,S);ctx.strokeStyle='#ffffff06';ctx.strokeRect(x*S,y*S,S,S);if(rocks.has(x+','+y)){ctx.fillStyle='#324a38';ctx.beginPath();ctx.ellipse(x*S+16,y*S+20,12,7,0,0,7);ctx.fill();ctx.fillStyle='#819080';ctx.beginPath();ctx.ellipse(x*S+14,y*S+14,10,9,-.3,0,7);ctx.fill()}else if(!path){ctx.strokeStyle='#a1bf6355';ctx.beginPath();const px=x*S+8+(x*3+y)%12,py=y*S+18;ctx.moveTo(px-3,py-4);ctx.lineTo(px,py);ctx.lineTo(px+2,py-6);ctx.stroke()}}
const px=player.x*S+15,py=player.y*S+15;ctx.fillStyle='#102a2280';ctx.beginPath();ctx.ellipse(px,py+7,11,6,0,0,7);ctx.fill();ctx.fillStyle='#f6d88e';ctx.beginPath();ctx.arc(px,py,9,0,7);ctx.fill();ctx.strokeStyle='#fff5d9';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#394f36';ctx.fillRect(px+2,py-3,2,3);status.textContent=`Kroki: ${steps} · Kratki ścieżki: ${paths} · Ślad tutaj: ${cells[player.y*N+player.x].wear}/5`}
for(const b of document.querySelectorAll('[data-d]')){b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held=b.dataset.d.split(',').map(Number);move(...held);lastMove=performance.now()});for(const type of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(type,()=>held=null)}
const keys={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};window.addEventListener('keydown',e=>{if(keys[e.key]){e.preventDefault();if(!e.repeat){held=keys[e.key];move(...held);lastMove=performance.now()}}});window.addEventListener('keyup',e=>{if(keys[e.key])held=null});window.addEventListener('blur',()=>held=null);document.addEventListener('visibilitychange',()=>held=null);document.querySelector('#reset').onclick=reset;
let decay=0;function frame(t){if(held&&t-lastMove>165){move(...held);lastMove=t}if(t-decay>1000){let changed=false;for(let i=0;i<cells.length;i++){const c=cells[i];if(i===player.y*N+player.x)continue;if(c.wear>0&&t-c.last>20000){c.wear--;c.last=t-15000;changed=true}}if(changed)draw();decay=t}requestAnimationFrame(frame)}reset();requestAnimationFrame(frame);
</script></html>
